name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install setuptools==80.9.0 wheel
          python -m pip install --no-build-isolation -r requirements-build.txt
      - name: Run tests
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q
      - name: Build and smoke-test portable package
        run: python packaging/build_windows.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterPilot_Pro-windows-x64
          path: |
            dist/InterPilot_Pro-windows-x64.zip
            dist/InterPilot_Pro-windows-x64.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/InterPilot_Pro-windows-x64.zip
          dist/InterPilot_Pro-windows-x64.zip.sha256
          --title "InterPilot Pro ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
